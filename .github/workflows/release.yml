name: Publish standalone release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (for example, v1.1.0)"
        required: true
        type: string
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Version must have the form v1.1.0"
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build standalone Windows app
        shell: pwsh
        run: ./build.ps1
      - name: Run noninteractive hotkey tests
        shell: pwsh
        run: |
          $test = Start-Process -FilePath "./dist/DesktopIconsToggle.exe" -ArgumentList "--test-hotkeys" -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Hotkey parser test failed ($($test.ExitCode))" }
      - name: Package standalone Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DesktopIconsToggle.exe,dist/README.md,dist/LICENSE,dist/PRIVACY.md,dist/SHA256SUMS.txt -DestinationPath DesktopIconsToggle-Windows-x64.zip
      - name: Publish public GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          gh release create "$env:RELEASE_TAG" "DesktopIconsToggle-Windows-x64.zip" --target "$env:GITHUB_SHA" --title "Desktop Icons Toggle $env:RELEASE_TAG" --generate-notes
