name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build standalone app
        shell: pwsh
        run: ./build.ps1
      - name: Test hotkey parsing
        shell: pwsh
        run: |
          $test = Start-Process -FilePath "./dist/DesktopIconsToggle.exe" -ArgumentList "--test-hotkeys" -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Hotkey parser test failed with exit code $($test.ExitCode)" }
      - name: Package standalone Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DesktopIconsToggle.exe,dist/README.md,dist/LICENSE,dist/PRIVACY.md,dist/SHA256SUMS.txt -DestinationPath DesktopIconsToggle-Windows-x64.zip
      - name: Upload downloadable Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DesktopIconsToggle-Windows-x64
          path: DesktopIconsToggle-Windows-x64.zip
          if-no-files-found: error
